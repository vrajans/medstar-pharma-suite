#:schema https://supabase.com/schemas/config/v1.json
# Supabase CLI v3 local development config (npx supabase start / npx supabase db reset)
project_id = "medstar-pharma-suite"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
# local email testing (Mailpit) for sign-up confirmations and magic links: http://localhost:54324
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3001/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10

[auth.email]
enabled = true
# keep false locally so you can sign up and onboard immediately; production must confirm emails
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
